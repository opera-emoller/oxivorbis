# cbindgen settings for include/oxivorbis.h. Regenerate with
#     just ffi-header
# CI fails if the committed header differs from a fresh one.

language = "C"
# C99 header usable from C++: `extern "C"` guards, no C++-only constructs.
cpp_compat = true
include_guard = "OXIVORBIS_H"
header = """
/*
 * oxivorbis: pure-Rust Ogg Vorbis encoder, byte-identical to libvorbis 1.3.7.
 * C API. SPDX-License-Identifier: Apache-2.0
 *
 * Ownership in one paragraph: every oxv_*_new has a matching oxv_*_free
 * (NULL is always accepted by the free functions). Bytes returned by
 * oxv_encoder_write_* are owned by the encoder and valid until the next call
 * on it; bytes from oxv_encoder_finish until oxv_encoder_free. An oxv_buffer
 * from oxv_encode_* is yours: release it with oxv_buffer_free. See
 * ffi/README.md for threading and examples.
 */"""
autogen_warning = "/* Generated by cbindgen from ffi/src. Do not edit: run `just ffi-header`. */"
no_includes = true
sys_includes = ["stddef.h", "stdint.h"]
usize_is_size_t = true
documentation = true
documentation_style = "doxy"
style = "both"
tab_width = 4

[export]
# Only the C API; nothing else is exported from the crate anyway.
prefix = ""
# Not in any signature (oxv_options_set_bitrate takes an int32_t, so an
# out-of-range value from C is an error, not undefined behaviour).
include = ["oxv_bitrate_mode"]

[enum]
# oxv_status::InvalidArgument -> OXV_STATUS_INVALID_ARGUMENT
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[parse]
parse_deps = false

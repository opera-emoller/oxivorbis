name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # parity-fuzz smoke: fixed seeds so a red run reproduces locally with
  #   cargo run -p parity-fuzz --release -- --iters 300 --seed 1 --quality <q>
  # (add --f32, or --max-len 30 --seed 3, for the other two smokes).
  FUZZ_ITERS: "300"
  FUZZ_SEED: "1"
  FUZZ_QUALITIES: "-0.1 0.2 0.5 0.8 1.0"
  FUZZ_F32_ITERS: "200"
  FUZZ_F32_QUALITIES: "-0.1 0.5 1.0"
  FUZZ_LONG_ITERS: "40"
  FUZZ_LONG_QUALITIES: "-0.1 1.0"
  # One rate per libvorbis template family other than 44.1/48 kHz, plus
  # range edges (XX, 8, 11, 16, 22, 32, X).
  FUZZ_FAMILY_RATES: "4000,8000,11025,15000,22050,25999,32000,96000,200000"
  # --bitrate (a random bitrate mode per case): the rates with bitrate
  # setups, one per family plus range edges.
  FUZZ_BITRATE_RATES: "8000,8999,11025,15000,22050,25999,32000,40000,44100,48000,50000"
  FUZZ_BITRATE_ITERS: "300"
  FUZZ_BITRATE_QUALITIES: "-0.1 0.5 1.0"
  # More than two channels: 5.1 at the 5.1 template's rates (40-70 kHz)
  # and outside it, and uncoupled 3, 4, 5, 7 and 8 channels.
  FUZZ_MC_ITERS: "120"
  FUZZ_MC_QUALITIES: "-0.1 0.3 0.5 1.0"
  FUZZ_MC_RATES: "44100,48000,70000,32000,96000"
  FUZZ_MC_CHANNELS: "3,4,5,6,7,8"
  # Bitrate modes with more than two channels: 5.1 on its template (40-70
  # kHz) and below it, and uncoupled counts at rates with bitrate setups.
  FUZZ_MC_BITRATE_51_RATES: "32000,40000,44100,48000,70000"
  FUZZ_MC_BITRATE_RATES: "11025,22050,44100,48000"
  FUZZ_MC_BITRATE_CHANNELS: "3,4,5,7,8"

jobs:
  test:
    name: test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          # Swatinem/rust-cache below handles caching (keyed per job).
          cache: false
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Install ffmpeg + vorbis-tools
        # ffmpeg: corpus_sweep decodes audio inputs to s16le PCM; the
        #   codebook test regenerates headers with it when present.
        # vorbis-tools: provides `oggenc` for the `parity_*` tests in
        #   tests/parity.rs (silence + the -q conversion test).
        # The C oracles need no system libraries: they compile the
        # vendored libvorbis 1.3.7 and libogg 1.3.5 sources.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg vorbis-tools
      - name: Verify vorbis-tools / libvorbis versions
        run: |
          # The parity_* tests compare against the system oggenc, which
          # dynamically links the system libvorbis. parity_silence_* is
          # sensitive to the 1.3.x branch, and
          # parity_oggenc_quality_conversion pins oggenc's -q float
          # conversion, which is vorbis-tools 1.4.x code. The source-of-truth
          # oracle is tools/oracle-encoder, built from the vendored sources.
          oggenc --version
          dpkg-query -W -f='${Version}\n' libvorbis0a | grep -E "^1\.3" \
            || { echo "::error::system libvorbis is not 1.3.x"; exit 1; }
          dpkg-query -W -f='${Version}\n' vorbis-tools | grep -E "^1\.4" \
            || { echo "::error::vorbis-tools is not 1.4.x"; exit 1; }
      - name: Build C oracles from the vendored sources
        # Each build script first checks tools/libvorbis-1.3.7 and
        # tools/libogg-1.3.5 against their SHA256SUMS.
        # oracle-encoder: parity tests, golden vectors, setup-header sweep,
        #   fuzz repros. dump_params / dump_quality_tables:
        #   quality_oracle_grid + tables. dsp_oracle: DSP tables/manifest.
        run: |
          ./tools/oracle-encoder/build.sh
          ./tools/oracle-encoder/build_quality_dumpers.sh
          ./tools/oracle-encoder/build_dsp_oracle.sh
      - name: Oracle-derived committed files are up to date
        # Regenerates the DSP manifest, quality/trig/drft/window tables,
        # setup books + templates and the header/MDCT test vectors with a
        # Linux/gcc build of libvorbis and fails on any diff against what
        # was committed (from macOS/clang).
        run: ./tools/oracle-encoder/check_fresh.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --features parallel -- -D warnings
      - run: cargo clippy --all-targets --features oracle,parallel -- -D warnings
      - run: cargo clippy --workspace --all-targets --features oxivorbis/oracle,oxivorbis/parallel -- -D warnings
      - name: Guard against silently skipped oracle tests
        # The oracle runs below use no name filter (they run the whole
        # suite with the feature on). This guard makes sure each
        # oracle-gated group still exists with at least as many tests as
        # it had when this list was last updated, so a cfg or rename slip
        # (or a macro arm going missing) can't drop tests unnoticed.
        # Raise the minimums when adding tests.
        run: |
          # JSON is nextest's stable machine format (the oneline text
          # format changed between releases); flatten to "<binary> <test>".
          cargo nextest list --features oracle --message-format json \
            | jq -r '."rust-suites" | to_entries[] | .key as $b | .value.testcases | keys[] | "\($b) \(.)"' \
            > "$RUNNER_TEMP/tests.txt"
          fail=0
          while IFS='|' read -r pat min; do
            n=$(grep -cF -- "$pat" "$RUNNER_TEMP/tests.txt" || true)
            echo "$pat: $n (min $min)"
            [ "$n" -ge "$min" ] || { echo "::error::only $n tests match '$pat' (expected >= $min)"; fail=1; }
          done <<'EOF'
          quality::tests::quality_oracle_grid|1
          quality::tests::templates_cover_every_rate_and_quality|1
          quality::tests::template_selection_edges|1
          quality::tests::template_lists_agree|1
          quality::tests::libvorbis_oob_inputs_are_exactly_known|1
          setup_gen::tests::oracle::oracle_setup_header_sweep|1
          parity oracle_parity_fuzz_repros|1
          parity oracle_parity_fuzz_repro_names|1
          parity oracle_parity_q::|360
          parity oracle_parity_rate::family::|560
          parity oracle_parity_rate::edge::|870
          parity oracle_parity_short_input::|47
          parity oracle_parity_long::cases::|18
          parity oracle_parity_long_silence_|2
          parity oracle_parity_transients_signal_uses_short_blocks|1
          parity oracle_parity_multichannel::surround::|264
          parity oracle_parity_multichannel::uncoupled::|288
          parity oracle_parity_multichannel::c255_short|1
          parity parity_oggenc_quality_conversion|1
          parity parity_silence_|4
          parity_bitrate bitrate_range::|72
          parity_bitrate bitrate_limits::|168
          parity_bitrate bitrate_tuning::|7
          parity_bitrate bitrate_long::|11
          parity_bitrate bitrate_rejects_like_libvorbis|1
          parity_bitrate encoder_tuning::|7
          parity_bitrate bitrate_multichannel::surround::|51
          parity_bitrate bitrate_multichannel::uncoupled::|50
          bitrate encoder_tuning_defaults_nan_and_clamps|1
          bitrate chunking_invariance_managed|1
          bitrate bitrate_api|1
          bitrate reuse_across_rates_returns_errors|1
          bitrate bitrates_hit_their_targets|1
          bitrate errors|1
          bitrate edges_do_not_panic|1
          bitrate::tests::|4
          ratecontrol::tests::|4
          dsp_manifest_|6
          parity_f32 |9
          streaming |8
          streaming chunking_invariance_multichannel|1
          conveniences planar_multichannel_matches_interleaved|1
          golden golden_vectors_match|1
          golden golden_vectors_are_fresh|1
          EOF
          echo "total: $(wc -l < "$RUNNER_TEMP/tests.txt") tests with --features oracle"
          exit $fail
      - name: Unit + integration tests (no oracle)
        run: cargo nextest run --status-level=fail --no-tests=fail
      - name: Unit + integration tests (no oracle, parallel)
        run: cargo nextest run --status-level=fail --no-tests=fail --features parallel
      - name: Full suite with oracle, serial path (Linux glibc libm)
        # Every non-ignored test with the oracle feature on: the parity
        # matrix, 30-120 s long-signal parity, short-input sweeps (incl.
        # q-1 up to 8400 frames), quality_oracle_grid, setup header sweep,
        # fuzz-repro replay, golden-vector freshness, DSP manifest tests
        # and parity_oggenc_quality_conversion.
        run: cargo nextest run --cargo-profile ci --status-level=fail --no-tests=fail --features oracle
      - name: Full suite with oracle, parallel path
        run: cargo nextest run --cargo-profile ci --status-level=fail --no-tests=fail --features oracle,parallel
      - name: Release-only streaming tests
        # #[ignore]d in debug builds (too slow there).
        run: >-
          cargo nextest run --release --status-level=fail --no-tests=fail --features parallel
          -E 'binary(streaming) & (test(chunking_invariance_10s) | test(streaming_emits_pages_before_finish) | test(buffer_is_bounded_over_10_minutes) | test(surround_streams_with_bounded_buffer))'
      - name: Doc tests
        run: cargo test --doc --features parallel
      - name: parity-fuzz smoke
        run: |
          cargo build -q --release -p parity-fuzz
          for q in $FUZZ_QUALITIES; do
            ./target/release/parity-fuzz --iters "$FUZZ_ITERS" --seed "$FUZZ_SEED" \
              --quality "$q" --minimize-per-sig 1
          done
      - name: parity-fuzz smoke (f32 input)
        run: |
          for q in $FUZZ_F32_QUALITIES; do
            ./target/release/parity-fuzz --f32 --iters "$FUZZ_F32_ITERS" --seed 2 \
              --quality "$q" --minimize-per-sig 1
          done
      - name: parity-fuzz smoke (inputs up to 30 s)
        run: |
          for q in $FUZZ_LONG_QUALITIES; do
            ./target/release/parity-fuzz --max-len 30 --iters "$FUZZ_LONG_ITERS" --seed 3 \
              --quality "$q" --minimize-per-sig 1
          done
      - name: parity-fuzz smoke (every template family)
        run: |
          for q in $FUZZ_QUALITIES; do
            ./target/release/parity-fuzz --rates "$FUZZ_FAMILY_RATES" --iters "$FUZZ_ITERS" \
              --seed 5 --quality "$q" --minimize-per-sig 1
            ./target/release/parity-fuzz --f32 --rates "$FUZZ_FAMILY_RATES" --iters "$FUZZ_F32_ITERS" \
              --seed 6 --quality "$q" --minimize-per-sig 1
          done
      - name: parity-fuzz smoke (bitrate modes)
        run: |
          for q in $FUZZ_BITRATE_QUALITIES; do
            ./target/release/parity-fuzz --bitrate --rates "$FUZZ_BITRATE_RATES" \
              --iters "$FUZZ_BITRATE_ITERS" --seed 8 --quality "$q" --max-len 20 --minimize-per-sig 1
          done
          ./target/release/parity-fuzz --bitrate --f32 --rates "$FUZZ_BITRATE_RATES" \
            --iters "$FUZZ_BITRATE_ITERS" --seed 9 --minimize-per-sig 1
          ./target/release/parity-fuzz --bitrate --channels 6 --rates "$FUZZ_MC_BITRATE_51_RATES" \
            --iters "$FUZZ_BITRATE_ITERS" --seed 11 --max-len 10 --minimize-per-sig 1
          ./target/release/parity-fuzz --bitrate --channels "$FUZZ_MC_BITRATE_CHANNELS" \
            --rates "$FUZZ_MC_BITRATE_RATES" --iters "$FUZZ_BITRATE_ITERS" --seed 12 --max-len 10 \
            --minimize-per-sig 1
      - name: parity-fuzz smoke (more than two channels)
        run: |
          for q in $FUZZ_MC_QUALITIES; do
            ./target/release/parity-fuzz --rates "$FUZZ_MC_RATES" --channels "$FUZZ_MC_CHANNELS" \
              --iters "$FUZZ_MC_ITERS" --seed 8 --quality "$q" --minimize-per-sig 1
            ./target/release/parity-fuzz --f32 --rates "$FUZZ_MC_RATES" --channels 6 \
              --iters "$FUZZ_MC_ITERS" --seed 9 --quality "$q" --minimize-per-sig 1
          done
      - name: parity-fuzz against an AddressSanitizer oracle
        # Same pristine sources, built with -fsanitize=address: any
        # out-of-bounds access in libvorbis/libogg on these inputs makes
        # the oracle fail, which parity-fuzz reports as oracle-fail.
        run: |
          OUT="$RUNNER_TEMP/oracle-asan" LW_EXTRA_CFLAGS="-g -fsanitize=address -fno-omit-frame-pointer" \
            ./tools/oracle-encoder/build.sh
          for q in -0.1 0.5 1.0; do
            ./target/release/parity-fuzz --oracle "$RUNNER_TEMP/oracle-asan" --iters 150 --seed 4 \
              --quality "$q" --no-minimize
            ./target/release/parity-fuzz --oracle "$RUNNER_TEMP/oracle-asan" --iters 150 --seed 7 \
              --rates "$FUZZ_FAMILY_RATES" --quality "$q" --no-minimize
            ./target/release/parity-fuzz --oracle "$RUNNER_TEMP/oracle-asan" --iters 60 --seed 10 \
              --rates "$FUZZ_MC_RATES" --channels "$FUZZ_MC_CHANNELS" --quality "$q" --no-minimize
          done
          # bitrate.c's packetblob indexing and truncation
          ./target/release/parity-fuzz --oracle "$RUNNER_TEMP/oracle-asan" --bitrate --iters 150 \
            --seed 10 --rates "$FUZZ_BITRATE_RATES" --max-len 20 --no-minimize
      - name: Upload parity-fuzz failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parity-fuzz-ubuntu
          path: target/parity-fuzz/
          if-no-files-found: ignore

  macos:
    # Determinism across platforms is a core claim: same parity set on
    # Apple silicon / clang / macOS libm as on Linux / gcc / glibc.
    name: test (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Install vorbis-tools
        # ffmpeg is skipped (large); the only non-ignored test using it
        # skips itself when ffmpeg is absent. The C oracles need no
        # system libraries.
        run: brew install vorbis-tools
      - name: Verify vorbis-tools / libvorbis versions
        run: |
          oggenc --version
          v=$(brew list --versions libvorbis)
          echo "$v"
          echo "$v" | grep -E " 1\.3" \
            || { echo "::error::system libvorbis is not 1.3.x"; exit 1; }
          t=$(brew list --versions vorbis-tools)
          echo "$t"
          echo "$t" | grep -E " 1\.4" \
            || { echo "::error::vorbis-tools is not 1.4.x"; exit 1; }
      - name: Build C oracles from the vendored sources
        run: |
          ./tools/oracle-encoder/build.sh
          ./tools/oracle-encoder/build_quality_dumpers.sh
          ./tools/oracle-encoder/build_dsp_oracle.sh
      - name: Oracle-derived committed files are up to date
        run: ./tools/oracle-encoder/check_fresh.sh
      - name: Full suite with oracle, serial path (macOS libm)
        run: cargo nextest run --cargo-profile ci --status-level=fail --no-tests=fail --features oracle
      - name: Full suite with oracle, parallel path
        run: cargo nextest run --cargo-profile ci --status-level=fail --no-tests=fail --features oracle,parallel
      - name: Release-only streaming tests
        run: >-
          cargo nextest run --release --status-level=fail --no-tests=fail
          -E 'binary(streaming) & (test(chunking_invariance_10s) | test(streaming_emits_pages_before_finish) | test(buffer_is_bounded_over_10_minutes) | test(surround_streams_with_bounded_buffer))'
      - name: parity-fuzz smoke
        run: |
          cargo build -q --release -p parity-fuzz
          for q in $FUZZ_QUALITIES; do
            ./target/release/parity-fuzz --iters "$FUZZ_ITERS" --seed "$FUZZ_SEED" \
              --quality "$q" --minimize-per-sig 1
          done
          for q in $FUZZ_F32_QUALITIES; do
            ./target/release/parity-fuzz --f32 --iters "$FUZZ_F32_ITERS" --seed 2 \
              --quality "$q" --minimize-per-sig 1
          done
          for q in $FUZZ_LONG_QUALITIES; do
            ./target/release/parity-fuzz --max-len 30 --iters "$FUZZ_LONG_ITERS" --seed 3 \
              --quality "$q" --minimize-per-sig 1
          done
          for q in $FUZZ_QUALITIES; do
            ./target/release/parity-fuzz --rates "$FUZZ_FAMILY_RATES" --iters "$FUZZ_ITERS" \
              --seed 5 --quality "$q" --minimize-per-sig 1
          done
          for q in $FUZZ_BITRATE_QUALITIES; do
            ./target/release/parity-fuzz --bitrate --rates "$FUZZ_BITRATE_RATES" \
              --iters "$FUZZ_BITRATE_ITERS" --seed 8 --quality "$q" --max-len 20 --minimize-per-sig 1
          done
          for q in $FUZZ_MC_QUALITIES; do
            ./target/release/parity-fuzz --rates "$FUZZ_MC_RATES" --channels "$FUZZ_MC_CHANNELS" \
              --iters "$FUZZ_MC_ITERS" --seed 8 --quality "$q" --minimize-per-sig 1
          done
      - name: Upload parity-fuzz failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parity-fuzz-macos
          path: target/parity-fuzz/
          if-no-files-found: ignore

  msrv:
    name: msrv (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.85"
          cache: false
      - uses: Swatinem/rust-cache@v2
      - name: cargo +1.85 check
        # rust-toolchain.toml pins the dev toolchain; +1.85 overrides it.
        run: cargo +1.85 check --all-targets --features parallel
      - name: cargo +1.85 check (C API crate)
        run: cargo +1.85 check -p oxivorbis-ffi --all-targets

  ffi:
    # The C API (ffi/): header freshness, the C test against the shared and
    # static library (byte-compared with oxivorbis::encode), the same under
    # AddressSanitizer and a leak checker, the C++ header smoke test, and
    # the Python ctypes binding against the CLI.
    name: ffi (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          # Pinned: the committed header is this version's output.
          tool: cbindgen@0.29.4
      - name: Install valgrind
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Header is up to date (just ffi-header-check)
        # Platform-independent; the Windows checkout has CRLF line endings,
        # so this runs on Linux and macOS only.
        if: runner.os != 'Windows'
        run: |
          cbindgen --config ffi/cbindgen.toml --crate oxivorbis-ffi --output "$RUNNER_TEMP/oxivorbis.h" ffi
          diff -u ffi/include/oxivorbis.h "$RUNNER_TEMP/oxivorbis.h" \
            || { echo "::error::ffi/include/oxivorbis.h is stale: run 'just ffi-header'"; exit 1; }
      - name: C and C++ tests (shared + static library)
        run: cargo test -p oxivorbis-ffi
      # Windows (MSVC target, clang driver): the C/C++ tests and the Python
      # binding run; ASan and the leak checker are Unix-only.
      - name: C test under AddressSanitizer
        if: runner.os != 'Windows'
        env:
          OXV_FFI_SANITIZE: address
        run: cargo test -p oxivorbis-ffi --test c_api c_api_shared_library
      - name: C test under a leak checker (leaks on macOS, valgrind on Linux)
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            export OXV_FFI_LEAK_CHECK="leaks --atExit --"
          else
            export OXV_FFI_LEAK_CHECK="valgrind --error-exitcode=1 --leak-check=full --errors-for-leak-kinds=definite,indirect"
          fi
          cargo test -p oxivorbis-ffi --test c_api c_api_leak_check
      - name: Python binding
        run: |
          cargo build -p oxivorbis-ffi -p oxivorbis-cli
          if [ "$RUNNER_OS" = Windows ]; then py=python; else py=python3; fi
          "$py" ffi/bindings/python/test_oxivorbis.py

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown, wasm32-wasip1
          cache: false
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasmtime
      - name: Build for wasm32-unknown-unknown
        run: cargo build --target wasm32-unknown-unknown --release
      - name: Tests on wasm32-wasip1 (wasmtime)
        # Unit tests (incl. DSP manifest), header/MDCT vectors, smoke
        # tests, the psy snapshot and tests/golden.rs, i.e. oxivorbis vs
        # committed oracle output under wasm's own libm and codegen.
        # Same list as `just wasm-test`.
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
        run: >-
          cargo test --target wasm32-wasip1
          --lib --test golden --test encode_smoke --test headers --test ogg_headers
          --test mdct --test psy --test codebook

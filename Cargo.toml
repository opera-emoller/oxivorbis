[workspace]
members = [".", "tools/gen-tables", "tools/gen-header-vectors", "tools/parity-diff", "tools/debug-rust-dump", "tools/debug-diff", "tools/lewtoff-cli", "tools/parity-fuzz"]

[package]
name = "lewtoff"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Pure-Rust Ogg Vorbis encoder, byte-identical to libvorbis (VBR q-1..q10)."
repository = "https://github.com/opera-emoller/lewtoff"
categories = ["multimedia::audio", "encoding"]
keywords = ["vorbis", "ogg", "audio", "encoder", "lossy"]
readme = "README.md"
documentation = "https://docs.rs/lewtoff"
# Ship only what the library needs to build (plus the small DSP manifest
# its unit tests include_str!). The vendored libvorbis, C oracles, test
# vectors and dev tooling under tools/ and tests/ stay in the repository.
include = [
    "/src/**",
    "/examples/**",
    "/tools/oracle-encoder/dsp_manifest.txt",
    "/README.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/NOTICE",
]

[package.metadata.docs.rs]
# Not all-features: that would also turn on the test-only `oracle` and
# `__internal` features.
features = ["parallel"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
# Enables the parity tests under tests/parity.rs. Requires `oggenc`
# (vorbis-tools) on PATH. Off by default so contributors without it can
# still run the bulk of the suite locally.
oracle = []
# Enables block-level encode parallelism via Rayon. Adds rayon (and its
# crossbeam transitive deps) to the build. Off by default to keep the
# library lean and WASM-friendly. When on, public API is unchanged but
# encode() fans out per-block analysis across the global Rayon pool.
parallel = ["dep:rayon"]
# Undocumented, unstable internals for this crate's own tests and tools
# (parity entry points, header/psy/mdct modules). Not part of the API.
__internal = []

[dependencies]
# Pinned exactly: src/ogg_pages.rs mirrors this version's internal page
# splitting (it emits a page by itself whenever 255 lacing values
# accumulate) to reproduce libogg's page boundaries. A release that changed
# that behaviour would silently change lewtoff's page layout, so upgrades
# must be deliberate and re-run the parity suite.
ogg = "=0.9.2"
rayon = { version = "1.10", optional = true }

[dev-dependencies]
lewton = "0.10"
# tests/robustness.rs drives encodes from inside Rayon pools.
rayon = "1.10"
# Integration tests reach the `__internal` entry points through this
# self-dependency, so plain `cargo test` works without extra flags.
lewtoff = { path = ".", features = ["__internal"] }

[profile.release]
debug = "line-tables-only"

[lints.rust]
unsafe_code = "forbid"
